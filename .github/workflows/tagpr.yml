name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # gh workflow run を打つのに要る。無いと 403 で落ちる
  actions: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      # サードパーティ action はタグではなく commit SHA で固定する。
      # タグは可変なので、上書きされると成果物へ任意コードを混ぜられる。
      # 更新は Dependabot（.github/dependabot.yml）が PR で提案する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # TAGPR_TOKEN があればそれを使う。無ければ GITHUB_TOKEN のまま（挙動は変わらない）。
      #
      # GITHUB_TOKEN で作った PR には、GitHub の no-recursion 制約で workflow が走らない。
      # リリース PR の Test が「ジョブ 0 件のまま失敗」と出るのはこれで、**中身が
      # 落ちているわけではない**（マージ後の main では同じ内容が通っている）。
      # 赤い印を消し、リリース PR そのものを検査したいなら、PAT か GitHub App の
      # トークンを TAGPR_TOKEN として置く。置かないままでも困らない
      - uses: Songmu/tagpr@242e22916eb775d6e359959fe3ba5c497de4a01a # v1.20.2
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ secrets.TAGPR_TOKEN || secrets.GITHUB_TOKEN }}

      # タグが打たれた回だけ、デスクトップのビルドを明示的に起こす。
      # tagpr は GITHUB_TOKEN で push するので、GitHub の no-recursion 制約により
      # release / push:tags イベントからは workflow が起動しない
      - name: Trigger desktop release
        if: steps.tagpr.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "New tag: ${{ steps.tagpr.outputs.tag }}"
          gh workflow run desktop-release.yml -f release_tag="${{ steps.tagpr.outputs.tag }}"
