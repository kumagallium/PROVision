# サードパーティ action は commit SHA で固定している（タグは可変で、
# 上書きされると成果物に任意コードを混ぜられる）。固定したままだと更新に
# 気づけないので、Dependabot に PR で提案させる。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
